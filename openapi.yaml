# =======================================================================
#  Schemas
# =======================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained via Auth/Authenticate

  schemas:
    # --- Base Entity DTOs ---

    AuthorDto:
      type: object
      description: Author/user profile. ID=0 indicates not found.
      properties:
        ID:
          type: integer
          format: int64
          description: Unique author identifier
        DisplayName:
          type: string
          description: Display name shown on posts and profiles
        Slug:
          type: string
          description: URL-friendly identifier
        Bio:
          type: string
          description: Biographical text
        WebsiteUrl:
          type: string
          description: Personal or professional website URL
        AvatarMediaId:
          type: integer
          format: int64
          description: Foreign key to avatar media file
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time

    PostDto:
      type: object
      description: Blog post. ID=0 indicates not found.
      properties:
        ID:
          type: integer
          format: int64
        Title:
          type: string
        Slug:
          type: string
          description: URL-friendly identifier
        Body:
          type: string
          description: Full post content
        Excerpt:
          type: string
          description: Short teaser text
        AuthorId:
          type: integer
          format: int64
        FeaturedImageId:
          type: integer
          format: int64
        MetaTitle:
          type: string
        MetaDescription:
          type: string
        MetaKeywords:
          type: string
          description: Comma-separated SEO keywords
        Status:
          type: integer
          description: "0=draft, 1=published, 2=archived"
          enum: [0, 1, 2]
        PublishedAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time
        UpdatedAt:
          type: string
          format: date-time

    PostListDto:
      type: object
      description: Paginated post list
      properties:
        Items:
          type: array
          items:
            $ref: '#/components/schemas/PostDto'
        Total:
          type: integer
          description: Total matching posts across all pages
        Page:
          type: integer
          description: Current page number (1-based)

    TagDto:
      type: object
      description: Blog tag. ID=0 indicates not found.
      properties:
        ID:
          type: integer
          format: int64
        Name:
          type: string
          description: Unique tag name
        Slug:
          type: string
        Description:
          type: string
        CreatedAt:
          type: string
          format: date-time

    CommentDto:
      type: object
      description: Blog comment. ID=0 indicates not found.
      properties:
        ID:
          type: integer
          format: int64
        PostId:
          type: integer
          format: int64
        AuthorName:
          type: string
          description: Visitor-supplied display name
        AuthorEmail:
          type: string
          description: Visitor-supplied email (optional)
        Body:
          type: string
        Status:
          type: integer
          description: "0=pending, 1=approved, 2=rejected"
          enum: [0, 1, 2]
        ModeratedBy:
          type: integer
          format: int64
          description: Author ID who moderated
        ModeratedAt:
          type: string
          format: date-time
        CreatedAt:
          type: string
          format: date-time

    MediaInfoDto:
      type: object
      description: Media file metadata (excludes StoragePath). ID=0 indicates not found.
      properties:
        ID:
          type: integer
          format: int64
        FileName:
          type: string
          description: Original file name
        MimeType:
          type: string
          description: "Detected MIME type (e.g. 'image/png')"
        FileSize:
          type: integer
          format: int64
          description: File size in bytes
        AltText:
          type: string
          description: Accessibility alternative text
        UploadedBy:
          type: integer
          format: int64
        CreatedAt:
          type: string
          format: date-time

    # --- Input DTOs ---

    AuthorCreateDto:
      type: object
      required: [DisplayName]
      properties:
        DisplayName:
          type: string
          description: Required, must not be empty
        Bio:
          type: string
        WebsiteUrl:
          type: string

    PostCreateDto:
      type: object
      required: [Title]
      properties:
        Title:
          type: string
          description: Required, must not be empty
        Body:
          type: string
        Excerpt:
          type: string
        AuthorId:
          type: integer
          format: int64
        FeaturedImageId:
          type: integer
          format: int64
        MetaTitle:
          type: string
        MetaDescription:
          type: string
        MetaKeywords:
          type: string
        Status:
          type: integer
          description: "0=draft, 1=published"
          enum: [0, 1]

    TagCreateDto:
      type: object
      required: [Name]
      properties:
        Name:
          type: string
          description: Required, must be unique
        Description:
          type: string

    CommentCreateDto:
      type: object
      required: [Body]
      properties:
        AuthorName:
          type: string
        AuthorEmail:
          type: string
        Body:
          type: string
          description: Required, must not be empty

    # --- Composite DTOs ---

    PostFullDto:
      type: object
      description: Fully enriched post with author, tags, and comments
      allOf:
        - $ref: '#/components/schemas/PostDto'
        - type: object
          properties:
            Author:
              $ref: '#/components/schemas/AuthorDto'
            Tags:
              type: array
              items:
                $ref: '#/components/schemas/TagDto'
            Comments:
              type: array
              items:
                $ref: '#/components/schemas/CommentDto'
            AuthorUnavailable:
              type: boolean
              description: True if users service was unreachable
            TagsUnavailable:
              type: boolean
              description: True if tags service was unreachable
            CommentsUnavailable:
              type: boolean
              description: True if comments service was unreachable

    PostWithAuthorDto:
      type: object
      description: Post enriched with author only (no tags or comments)
      allOf:
        - $ref: '#/components/schemas/PostDto'
        - type: object
          properties:
            Author:
              $ref: '#/components/schemas/AuthorDto'
            AuthorUnavailable:
              type: boolean

    PostsByTagDto:
      type: object
      description: Tag with its associated published posts
      properties:
        Tag:
          $ref: '#/components/schemas/TagDto'
        Posts:
          type: array
          items:
            $ref: '#/components/schemas/PostWithAuthorDto'

    # --- Analytics DTOs ---

    OverviewDto:
      type: object
      description: Aggregate counts from all services
      properties:
        Posts:
          type: integer
          description: Total posts (-1 if unavailable)
        Authors:
          type: integer
          description: Total authors (-1 if unavailable)
        Tags:
          type: integer
          description: Total tags (-1 if unavailable)
        PendingComments:
          type: integer
          description: Pending comments (-1 if unavailable)
        PostsUnavailable:
          type: boolean
        AuthorsUnavailable:
          type: boolean
        TagsUnavailable:
          type: boolean
        CommentsUnavailable:
          type: boolean

    AuthorStatDto:
      type: object
      description: Per-author statistics
      properties:
        AuthorId:
          type: integer
          format: int64
        DisplayName:
          type: string
        PostCount:
          type: integer
        CommentCount:
          type: integer
          description: Total approved comments on author's posts

    TagCloudItemDto:
      type: object
      description: Tag with usage count
      properties:
        TagId:
          type: integer
          format: int64
        Name:
          type: string
        Slug:
          type: string
        PostCount:
          type: integer

    TopCommentedPostDto:
      type: object
      properties:
        PostId:
          type: integer
          format: int64
        Title:
          type: string
        CommentCount:
          type: integer

    CommentActivityDto:
      type: object
      description: Comment activity overview
      properties:
        PendingCount:
          type: integer
        TopCommentedPosts:
          type: array
          items:
            $ref: '#/components/schemas/TopCommentedPostDto'
          description: Top 10 posts by comment count (descending)
