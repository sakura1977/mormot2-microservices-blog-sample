<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Blog - Microservices Demo">
  <title>Blog</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="logo">Blog</a>
      <nav id="main-nav">
        <a href="/">Home</a>
        <a href="#" onclick="loadTags(); return false;">Tags</a>
        <a href="#" onclick="loadAnalytics(); return false;">Analytics</a>
        <a href="#" onclick="loadLogs(); return false;">Logs</a>
        <span id="auth-nav">
          <a href="#" onclick="showLogin(); return false;">Sign In</a>
        </span>
      </nav>
    </div>
  </header>

  <main class="container" id="app">
    <!-- Content is loaded dynamically via JavaScript -->
    <div class="loading">Loading...</div>
  </main>

  <!-- Login Dialog -->
  <div id="login-modal" class="modal hidden">
    <div class="modal-content">
      <span class="modal-close" onclick="hideLogin()">&times;</span>
      <h2>Sign In</h2>
      <form onsubmit="doLogin(event)">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required>
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required>
        <button type="submit">Sign In</button>
        <p id="login-error" class="error hidden"></p>
      </form>
    </div>
  </div>

  <!-- Post Editor -->
  <div id="editor-modal" class="modal hidden">
    <div class="modal-content modal-wide">
      <span class="modal-close" onclick="hideEditor()">&times;</span>
      <h2 id="editor-title">New Post</h2>
      <form onsubmit="savePost(event)">
        <input type="hidden" id="editor-id">
        <label for="editor-post-title">Title</label>
        <input type="text" id="editor-post-title" required>
        <label for="editor-excerpt">Excerpt</label>
        <textarea id="editor-excerpt" rows="2"></textarea>
        <label for="editor-body">Content</label>
        <textarea id="editor-body" rows="12" required></textarea>
        <div class="form-row">
          <div>
            <label for="editor-meta-title">SEO Title</label>
            <input type="text" id="editor-meta-title">
          </div>
          <div>
            <label for="editor-meta-desc">SEO Description</label>
            <input type="text" id="editor-meta-desc">
          </div>
        </div>
        <label for="editor-meta-keywords">SEO Keywords</label>
        <input type="text" id="editor-meta-keywords" placeholder="comma-separated">
        <label>Tags</label>
        <div id="editor-tags" class="tag-checkboxes"></div>
        <div class="new-tag-row">
          <input type="text" id="editor-new-tag" placeholder="New tag...">
          <button type="button" onclick="addNewTag()">+</button>
        </div>
        <label for="editor-status">Status</label>
        <select id="editor-status">
          <option value="0">Draft</option>
          <option value="1">Published</option>
        </select>
        <button type="submit">Save</button>
      </form>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container">
      <p>Blog Microservices Demo &mdash; Delphi 13 + mORMot2</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
